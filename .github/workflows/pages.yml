# Publish docs/ to GitHub Pages.
#
# The legacy Jekyll builder failed opaquely on the first build of this site
# ("Page build failed", no log, duration 0) despite docs/ containing only a
# .nojekyll marker and a self-contained index.html with no Liquid syntax. This
# workflow replaces it: a static upload with a visible log, so a failure is
# diagnosable rather than merely reported.
name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the validator
        # NOT optional. validate_provenance.py now FAILS rather than warns when
        # jsonschema is absent, because it previously printed "All provenance
        # checks passed" on a machine where structural validation had not run.
        run: python3 -m pip install --quiet jsonschema

      - name: Verify the page is what the generator produces from verified inputs
        # The gate this workflow was missing. Publication used to check only that
        # docs/index.html existed and contained the title, which left a bypass:
        # modify raw material, run build_viewer.py DIRECTLY, commit the changed
        # page, and Pages published it -- no manifest verification, no provenance
        # validation, nothing. Found by Codex reviewing the D-29 repair.
        #
        # So CI now runs the whole maintenance path on a clean checkout and
        # requires the committed page to equal the regenerated one byte for byte.
        # That makes the published page a function of verified inputs rather than
        # of whatever someone committed.
        #
        # This is only possible because the page no longer embeds a git commit
        # hash. While it did, a rebuild ALWAYS diffed and this check could never
        # have been written -- the tripwire was permanently tripped. The
        # provenance line is now a digest of the generator's inputs.
        run: |
          test -f docs/.nojekyll || { echo "docs/.nojekyll missing"; exit 1; }
          python3 tools/rebuild.py
          if ! git diff --quiet -- docs/; then
            echo "::error::The committed page is not what the generator produces."
            echo "Either docs/ was hand-edited, or it was built from inputs that"
            echo "differ from what is committed. Run: python3 tools/rebuild.py"
            git diff --stat -- docs/
            git diff -- docs/ | head -60
            exit 1
          fi
          echo "Committed page matches a clean regeneration from verified inputs."
          echo "index.html bytes: $(wc -c < docs/index.html)"

      - name: Integrity regression suite
        # 23 cases, each one a defect that was live in this repository on
        # 2026-08-06 and found by running the attack rather than reading the
        # code. A repair described in a commit message is a claim; a repair a
        # build re-runs is a control.
        run: python3 tools/test_integrity.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
