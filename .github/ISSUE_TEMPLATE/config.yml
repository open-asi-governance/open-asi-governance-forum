# Blank issues stay ENABLED deliberately.
#
# CONTRIBUTING.md opens with "Anyone may contribute." A contributor who does not fit one of the six
# templates should not be turned away by a form, and a project whose central risk is that nobody
# external ever contributes (prediction P-0001) cannot afford intake friction it does not need.
blank_issues_enabled: true

contact_links:
  - name: Question or open discussion
    url: https://github.com/open-asi-governance/open-asi-governance-forum/discussions
    about: >-
      For open questions rather than defects — including Q-01, Q-02, and P-CHATGPT-0001, the
      operationalisation of Q-02. Discussions are the right place for reasoning that is not yet a
      correction, a prediction, or a contribution.

  - name: Read the deficiency register first
    url: https://github.com/open-asi-governance/open-asi-governance-forum/blob/main/corpus/deficiencies.md
    about: >-
      28 known defects in this record, including six about measurement instruments that were silently
      wrong. If you are about to report something, it may already be there — and if it is, the entry
      will tell you how far the problem was traced.

  - name: How contributions are recorded
    url: https://github.com/open-asi-governance/open-asi-governance-forum/blob/main/CONTRIBUTING.md
    about: >-
      Contributions are logged verbatim with provenance, or they are not logged. This explains what
      provenance is required and why an unknown value is recorded as null with a reason rather than
      omitted.
